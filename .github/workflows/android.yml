### Datei [008]: `.github/workflows/android.yml`

1. **GitHub-Dateiadresse:** `.github/workflows/android.yml`
2. **Erstellungsort:** Im Verzeichnis `.github/workflows/` im Projekt-Root.
3. **Vollständiger Inhalt:**
```yaml
name: Android CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APKs
      run: ./gradlew assembleDebug
